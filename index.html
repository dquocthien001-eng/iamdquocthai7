.home{position:absolute;bottom:max(48px,env(safe-area-inset-bottom) + 28px);left:50%;transform:translateX(-50%);width:88px;height:88px;border-radius:50%;border:1px solid #ffbfe577;background:radial-gradient(circle at 35% 30%,#ffffff20,#ffffff04 60%,#ff69b40b);backdrop-filter:blur(14px);color:#ffe4f4;box-shadow:0 0 28px #f75ab433,inset 0 0 19px #fff2;display:grid;place-items:center;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}.home:before{content:'';position:absolute;inset:7px;border:1px solid #ffffff42;border-radius:50%}.home svg{width:32px;height:32px;fill:#ff6eae;stroke:#ffd9ed;filter:drop-shadow(0 0 12px #ff55b9);animation:heartBeat 1.6s ease-in-out infinite}@keyframes heartBeat{50%{transform:scale(1.2)}}.home .progress{position:absolute;inset:-6px;border-radius:50%;background:conic-gradient(#ff8cda var(--hold,0%),transparent 0);mask:radial-gradient(transparent 64%,#000 66%);-webkit-mask:radial-gradient(transparent 64%,#000 66%)}.hint{position:absolute;bottom:max(12px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#e7c9e1b0;font-size:12px;letter-spacing:2px}.particle-label{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}.particle-label small{position:absolute;top:67%;font-size:12px;letter-spacing:3px;color:#ffd1e77c}.sphere-wrap{position:absolute;inset:0;display:grid;place-items:center;perspective:1100px;perspective-origin:50% 50%}.sphere{position:relative;width:0;height:0;transform-style:preserve-3d;cursor:pointer;animation:spinRight 32s linear infinite}.sphere:active{animation-play-state:paused}.photo{position:absolute;width:var(--photo-size,clamp(62px,10vw,112px));aspect-ratio:3/4;left:0;top:0;transform-style:preserve-3d;transform:translate(-50%,-50%) var(--pos);border:2px solid #ffb6db99;border-radius:10px;overflow:hidden;box-shadow:0 0 22px #fa5aab77;background:#27102c;backface-visibility:visible;transition:transform 3.2s cubic-bezier(.16,.82,.18,1),opacity 2.4s ease}.photo img{width:100%;height:100%;object-fit:cover;display:block}.sphere.scatter .photo{transform:translate(-50%,-50%) var(--scatter);opacity:.12}.sphere.gathering{pointer-events:none}.sphere.gathering .photo{transition-duration:3.2s,2.4s}@keyframes spinRight{from{transform:rotateX(-12deg) rotateY(0deg)}to{transform:rotateX(-12deg) rotateY(360deg)}}.stage-tip{position:absolute;bottom:7%;width:100%;text-align:center;color:#ffd1e8;font-size:13px;letter-spacing:2px;text-shadow:0 0 14px #f48}.rows{position:absolute;inset:12% 0;display:flex;flex-direction:column;justify-content:space-around;gap:12px}.lane{height:29%;display:flex;align-items:center;width:max-content;gap:clamp(15px,3vw,38px);animation:slide 32s linear infinite;will-change:transform}.lane:nth-child(2){animation-duration:39s;animation-delay:-13s}.lane:nth-child(3){animation-duration:35s;animation-delay:-8s}.lane img{height:100%;width:auto;aspect-ratio:3/4;object-fit:cover;border:2px solid #ffb4db9c;border-radius:10px;box-shadow:0 0 24px #ff6cbb55;cursor:pointer;transition:scale .25s}.lane img:hover{scale:1.08}@keyframes slide{to{transform:translateX(-50%)}}.curtain{position:absolute;inset:0;display:flex;justify-content:space-between;pointer-events:none}.side{height:100%;width:clamp(115px,29vw,350px);display:flex;justify-content:center;overflow:hidden;mask-image:linear-gradient(transparent,#000 9% 91%,transparent);-webkit-mask-image:linear-gradient(transparent,#000 9% 91%,transparent)}.side.right{justify-content:center}.strip{width:100%;height:max-content;display:flex;align-items:center;flex-direction:column;gap:20px;animation:fallDown 90s linear infinite;will-change:transform}.strip img{display:block;width:min(92%,290px);aspect-ratio:3/4;object-fit:cover;border:2px solid #ffb5dba8;border-radius:13px;box-shadow:0 0 24px #ff66bb66}.right .strip{animation-duration:103s;animation-delay:-37s}@keyframes fallDown{from{transform:translateY(-50%)}to{transform:translateY(0)}}.gift-center{position:absolute;inset:0;display:grid;place-items:center}.gift{position:relative;width:clamp(105px,24vw,185px);height:clamp(105px,24vw,185px);border:0;background:none;cursor:pointer;filter:drop-shadow(0 0 30px #f58bc4);animation:giftFloat 2.7s ease-in-out infinite}.gift svg{width:100%;height:100%}@keyframes giftFloat{50%{transform:translateY(-13px)}}.gift-caption{position:absolute;top:calc(50% + 110px);left:0;right:0;text-align:center;color:#ffd6ed;letter-spacing:2px;font-size:13px}.letter-overlay{position:fixed;inset:0;background:#05040ecb;z-index:20;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(12px)}.letter-overlay.open{display:flex}.letter{position:relative;width:min(660px,94vw);max-height:85vh;overflow:auto;background:linear-gradient(145deg,#fffafc,#ffe5f1);border-radius:18px;color:#713653;box-shadow:0 0 90px #ff8cc17c;padding:clamp(24px,5vw,48px);text-align:center;animation:letterIn .7s cubic-bezier(.2,.8,.2,1)}@keyframes letterIn{from{transform:translateY(-80px) scale(.7);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}.letter h1{font-family:Georgia,serif;color:#bd377b;font-size:clamp(25px,5vw,42px)}.letter p{line-height:1.9;font-size:clamp(15px,2.7vw,19px)}.close{position:absolute;right:14px;top:10px;border:0;background:transparent;color:#8a4266;font-size:30px;cursor:pointer}.replay{position:absolute;bottom:18px;right:18px;border:1px solid #ffffff55;background:#ffffff12;color:white;border-radius:30px;padding:9px 14px;cursor:pointer;z-index:8}.hidden{display:none!important}@media(max-width:600px){.side{width:31vw}.side .strip{gap:14px}.side img{width:94%;border-radius:8px}.rows{inset:17% 0}.lane{height:23%}.photo{width:clamp(57px,15vw,80px)}.gift-caption{top:calc(50% + 90px)}}@media(prefers-reduced-motion:reduce){.lane,.strip,.sphere{animation-duration:65s}}

/* Transition: gallery photographs lift upward before the 20-photo curtain appears. */

/* Bước 7: thư kính mờ vàng kem #FFFFCC, hình chữ nhật trượt từ trên xuống. */

   const x=radius*ringScale*Math.sin(lon);
   const y=-radius*Math.sin(lat);
   const z=radius*ringScale*Math.cos(lon);

   tile.style.height=tileHeight.toFixed(2)+'px';
   tile.style.aspectRatio='auto';

function updateMusic(){const src=fileMusicUrl||localStorage.getItem('loveMusicUrl')||'';if(src&&audio.getAttribute('src')!==src){audio.src=src;audio.load()}}
$('settingsToggle').onclick=()=>{$('settingsPanel').hidden=!$('settingsPanel').hidden;sync()};$('settingsClose').onclick=()=>{$('settingsPanel').hidden=true};
$('saveSettings').onclick=()=>{localStorage.setItem('loveLetterTitle',$('editTitle').value.trim()||defaultTitle);localStorage.setItem('loveLetterText',$('editLetter').value.trim()||defaultText);localStorage.setItem('loveMusicUrl',$('musicUrl').value.trim());applyTitle();updateMusic();$('settingsPanel').hidden=true};
$('resetSettings').onclick=()=>{['loveLetterTitle','loveLetterText','loveMusicUrl'].forEach(k=>localStorage.removeItem(k));if(fileMusicUrl)URL.revokeObjectURL(fileMusicUrl);fileMusicUrl=null;audio.pause();audio.removeAttribute('src');audio.load();applyTitle();sync()};
$('musicFile').onchange=e=>{const file=e.target.files?.[0];if(!file)return;if(fileMusicUrl)URL.revokeObjectURL(fileMusicUrl);fileMusicUrl=URL.createObjectURL(file);updateMusic()};
$('musicToggle').onclick=async()=>{if(!audio.paused){audio.pause();sync();return}updateMusic();if(!audio.src){$('settingsPanel').hidden=false;sync();return}try{await audio.play()}catch(e){$('settingsPanel').hidden=false;console.warn('Không thể phát nhạc:',e)}sync()};audio.onplay=sync;audio.onpause=sync;
applyTitle();updateMusic();sync();
})();
</script>
</body></html>
